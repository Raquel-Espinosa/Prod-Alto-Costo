<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Actividades - Alto Costo</title>
    <!-- Tailwind CSS para el diseño adaptativo y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Ocultar flechas en los inputs numéricos */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <!-- Navbar -->
    <nav class="bg-blue-800 text-white p-4 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">App Alto Costo</h1>
            <span id="user-display" class="text-sm font-semibold bg-blue-900 px-2 py-1 rounded hidden"></span>
        </div>
    </nav>

    <main class="max-w-md mx-auto p-4 mt-4">
        
        <!-- Pantalla de Configuración Inicial (Número de Empleado) -->
        <div id="setup-screen" class="bg-white rounded-xl shadow-md p-6 mb-6">
            <h2 class="text-lg font-bold mb-4 text-center">Identificación</h2>
            <p class="text-sm text-gray-600 mb-4 text-center">Ingrese su número de empleado para continuar.</p>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Número de Empleado</label>
                <input type="text" id="num-empleado" maxlength="8" placeholder="Ej. AB123456" 
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 uppercase"
                    oninput="this.value = this.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase()">
            </div>
            <button onclick="saveEmployee()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition">
                Ingresar
            </button>
        </div>

        <!-- Menú Principal -->
        <div id="main-menu" class="hidden">
            <h2 class="text-lg font-bold mb-4 text-center text-gray-700">Seleccione una Actividad</h2>
            <div class="grid grid-cols-1 gap-4">
                <button onclick="openForm('Cerrado')" class="bg-white border-l-4 border-blue-500 shadow hover:shadow-md p-4 rounded-lg flex items-center justify-between transition">
                    <span class="font-bold text-gray-700">1. Cerrado</span>
                    <span class="text-blue-500">&#10140;</span>
                </button>
                <button onclick="openForm('Recibo')" class="bg-white border-l-4 border-green-500 shadow hover:shadow-md p-4 rounded-lg flex items-center justify-between transition">
                    <span class="font-bold text-gray-700">2. Recibo</span>
                    <span class="text-green-500">&#10140;</span>
                </button>
                <button onclick="openForm('Embarque')" class="bg-white border-l-4 border-purple-500 shadow hover:shadow-md p-4 rounded-lg flex items-center justify-between transition">
                    <span class="font-bold text-gray-700">3. Embarque</span>
                    <span class="text-purple-500">&#10140;</span>
                </button>
                <button onclick="openForm('Armado de cargas')" class="bg-white border-l-4 border-orange-500 shadow hover:shadow-md p-4 rounded-lg flex items-center justify-between transition">
                    <span class="font-bold text-gray-700">4. Armado de cargas</span>
                    <span class="text-orange-500">&#10140;</span>
                </button>
                <button onclick="openForm('Excel')" class="bg-white border-l-4 border-emerald-500 shadow hover:shadow-md p-4 rounded-lg flex items-center justify-between transition">
                    <span class="font-bold text-gray-700">5. Excel</span>
                    <span class="text-emerald-500">&#10140;</span>
                </button>
            </div>
            <div class="mt-8 text-center">
                <button onclick="changeEmployee()" class="text-sm text-red-500 underline">Cambiar de Empleado</button>
            </div>
        </div>

        <!-- Contenedor de Formularios -->
        <div id="form-container" class="hidden bg-white rounded-xl shadow-md p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 id="form-title" class="text-xl font-bold text-gray-800">Título</h2>
                <button onclick="closeForm()" class="text-gray-500 hover:text-red-500 font-bold">&times; Volver</button>
            </div>

            <form id="activity-form" onsubmit="submitData(event)">
                <input type="hidden" id="actividad-actual">

                <!-- Campos Dinámicos se mostrarán aquí -->
                <div id="dynamic-fields" class="space-y-4"></div>

                <div class="mt-8">
                    <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition flex justify-center items-center">
                        Guardar Actividad
                    </button>
                </div>
            </form>
        </div>

    </main>

    <!-- Modal/Mensaje de Alerta -->
    <div id="alert-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg p-6 max-w-sm w-full shadow-xl text-center">
            <h3 id="alert-title" class="text-lg font-bold mb-2">Mensaje</h3>
            <p id="alert-message" class="text-gray-600 mb-6"></p>
            <button onclick="closeAlert()" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 w-full">Entendido</button>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN DE URL DE GOOGLE APPS SCRIPT
        // ==========================================
        // ¡IMPORTANTE! Reemplaza esta URL con la tuya generada en el Paso 2 de las instrucciones.
        const URL_GOOGLE_SCRIPT = 'https://script.google.com/macros/s/AKfycby5clNpvUAABxhZz4qtJxwuhLTWVmXSrGB-TtRG3QpNSi1caouaqehzqsgcjCEmYB7d/exec';
        // ==========================================

        let empleadoActual = '';

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            const guardado = localStorage.getItem('altoCosto_empleado');
            if (guardado) {
                empleadoActual = guardado;
                showMainMenu();
            }
        });

        // Lógica de Empleado
        function saveEmployee() {
            const input = document.getElementById('num-empleado').value.trim();
            if (input.length > 0 && input.length <= 8) {
                empleadoActual = input;
                localStorage.setItem('altoCosto_empleado', empleadoActual);
                showMainMenu();
            } else {
                showAlert('Error', 'Debe ingresar un número de empleado válido (hasta 8 caracteres alfanuméricos).');
            }
        }

        function changeEmployee() {
            localStorage.removeItem('altoCosto_empleado');
            empleadoActual = '';
            document.getElementById('num-empleado').value = '';
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('user-display').classList.add('hidden');
        }

        function showMainMenu() {
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('form-container').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            
            const userDisplay = document.getElementById('user-display');
            userDisplay.textContent = `EMP: ${empleadoActual}`;
            userDisplay.classList.remove('hidden');
        }

        // Lógica de Formularios Dinámicos
        const formConfigs = {
            'Cerrado': [
                { id: 'tienda', label: 'Número de Tienda (7100 - 7501)', type: 'number', required: true, min: 7100, max: 7501 },
                { id: 'entrega', label: 'Número de entrega', type: 'number', required: true },
                { id: 'piezas', label: 'Num de piezas', type: 'number', required: true }
            ],
            'Recibo': [
                { id: 'ua', label: 'Número de UA', type: 'number', required: true },
                { id: 'piezasUa', label: '# Piezas UA', type: 'number', required: true }
            ],
            'Embarque': [
                { id: 'tienda', label: 'Tienda', type: 'number', required: true },
                { id: 'grupo', label: 'Grupo', type: 'number', required: true }
            ],
            'Armado de cargas': [
                { id: 'tienda', label: 'Tienda', type: 'number', required: true },
                { id: 'grupo', label: 'Grupo', type: 'number', required: true }
            ],
            'Excel': [
                { id: 'tienda', label: 'Número de Tienda (7100 - 7501)', type: 'number', required: true, min: 7100, max: 7501 },
                { id: 'cajas', label: 'Num cajas', type: 'number', required: true }
            ]
        };

        function openForm(actividad) {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('form-container').classList.remove('hidden');
            document.getElementById('form-title').textContent = actividad;
            document.getElementById('actividad-actual').value = actividad;
            
            const container = document.getElementById('dynamic-fields');
            container.innerHTML = ''; // Limpiar campos anteriores

            const config = formConfigs[actividad];
            config.forEach(field => {
                const div = document.createElement('div');
                div.innerHTML = `
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="${field.id}">${field.label}</label>
                    <input type="${field.type}" id="${field.id}" name="${field.id}" inputmode="numeric"
                        ${field.required ? 'required' : ''}
                        ${field.min ? `min="${field.min}"` : ''}
                        ${field.max ? `max="${field.max}"` : ''}
                        class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                `;
                container.appendChild(div);
            });
        }

        function closeForm() {
            document.getElementById('form-container').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            document.getElementById('activity-form').reset();
        }

        // Utilidades de Tiempo
        function getWeekNumber(date) {
            // Semana inicia en Domingo
            const firstDayOfYear = new Date(date.getFullYear(), 0, 1);
            const pastDaysOfYear = (date - firstDayOfYear) / 86400000;
            return Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
        }

        function getCurrentDateFormatted() {
            const today = new Date();
            const yyyy = today.getFullYear();
            let mm = today.getMonth() + 1; 
            let dd = today.getDate();
            if (dd < 10) dd = '0' + dd;
            if (mm < 10) mm = '0' + mm;
            return dd + '/' + mm + '/' + yyyy;
        }

        function getCurrentTimeFormatted() {
            const today = new Date();
            let hh = today.getHours();
            let mm = today.getMinutes();
            let ss = today.getSeconds();
            if (hh < 10) hh = '0' + hh;
            if (mm < 10) mm = '0' + mm;
            if (ss < 10) ss = '0' + ss;
            return hh + ':' + mm + ':' + ss;
        }

        // Envío de Datos
        async function submitData(e) {
            e.preventDefault();

            if (URL_GOOGLE_SCRIPT.trim() === '') {
                showAlert('Falta Configuración', 'El desarrollador debe colocar el URL de Google Apps Script en el código fuente para que la app funcione.');
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="animate-pulse">Guardando...</span>';

            const actividad = document.getElementById('actividad-actual').value;
            const now = new Date();

            // Construir los datos a enviar
            const formData = new URLSearchParams();
            formData.append('empleado', empleadoActual);
            formData.append('fecha', getCurrentDateFormatted());
            formData.append('hora', getCurrentTimeFormatted());
            formData.append('semana', getWeekNumber(now));
            formData.append('actividad', actividad);

            // Obtener valores de los campos dinámicos
            const config = formConfigs[actividad];
            let isValid = true;

            config.forEach(field => {
                const val = document.getElementById(field.id).value;
                if (field.min && field.max) {
                    const numVal = parseInt(val, 10);
                    if (numVal < field.min || numVal > field.max) {
                        isValid = false;
                        showAlert('Error de validación', `El campo "${field.label}" debe estar entre ${field.min} y ${field.max}.`);
                    }
                }
                formData.append(field.id, val);
            });

            if (!isValid) {
                resetButton(btn);
                return;
            }

            try {
                // Enviar usando fetch (metodo x-www-form-urlencoded compatible sin CORS complejos)
                const response = await fetch(URL_GOOGLE_SCRIPT, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    showAlert('¡Éxito!', 'Los datos se guardaron correctamente en la hoja.');
                    closeForm(); // Vuelve al menú
                } else {
                    throw new Error('Respuesta de red no fue OK.');
                }
            } catch (error) {
                console.error('Error:', error);
                // Si falla el CORS pero el dato llega (comportamiento comun de google forms), mostramos éxito.
                // Para evitar confusiones, el App script debe regresar status 200.
                showAlert('Aviso', 'Petición enviada. Revise su hoja de Google para confirmar.');
                closeForm();
            } finally {
                resetButton(btn);
            }
        }

        function resetButton(btn) {
            btn.disabled = false;
            btn.innerHTML = 'Guardar Actividad';
        }

        // Alertas Personalizadas (reemplaza alert())
        function showAlert(title, message) {
            document.getElementById('alert-title').textContent = title;
            document.getElementById('alert-message').textContent = message;
            document.getElementById('alert-modal').classList.remove('hidden');
        }

        function closeAlert() {
            document.getElementById('alert-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
